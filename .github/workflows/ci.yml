name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  # Build & test .NET backend (API + Workers)
  # ============================================================
  build-backend:
    name: Build Backend (.NET)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x

      - name: Restore NuGet packages
        run: dotnet restore VolleySquad.sln

      - name: Build solution
        run: dotnet build VolleySquad.sln --no-restore --configuration Release

  # ============================================================
  # Build React frontend
  # ============================================================
  build-frontend:
    name: Build Frontend (React + TypeScript)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: volleysquad-fe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: volleysquad-fe/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
